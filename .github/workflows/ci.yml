name: Linter, formatter and tests
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Run Ktlint
        run: ./gradlew ktlintCheck
      - name: Run Detekt
        run: ./gradlew detekt
      - name: Run Tests
        run: ./gradlew test
